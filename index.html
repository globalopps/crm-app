const $ = (s, r = document) => r.querySelector(s);

const pad = n => String(n).padStart(2, '0');
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

const fHora = d => { const h = d.getHours(), m = d.getMinutes(); return (!h && !m) ? '' : ` ${h % 12 || 12}:${pad(m)} ${h < 12 ? 'am' : 'pm'}`; };
const fFecha = iso => { if (!iso) return '—'; const d = new Date(iso); return `${d.getDate()} ${MES[d.getMonth()]}` + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); };

function vence(l) { if (!l.prox_vence) return 'sin'; const d = dia0(l.prox_vence), h = hoy0(); return d < h ? 'vencido' : d === h ? 'hoy' : 'prox'; }
function cuando(iso) { if (!iso) return 'Sin fecha'; const d = new Date(iso), df = Math.round((dia0(iso) - hoy0()) / 864e5); const base = df === 0 ? 'Hoy' : df === 1 ? 'Mañana' : df === -1 ? 'Ayer' : `${DIA[d.getDay()]} ${fFecha(iso)}`; return base + fHora(d); }

/* Ingreso propio estimado en USD — SOLO se calcula para el admin */
function ingresoUSD(l) {
  if (!esAdmin()) return 0;
  const pl = S.privLead[l.id], pp = S.privPipe[l.pipeline_id], pipe = P(l.pipeline_id) || {};
  if (pl && pl.ingreso_estimado != null) return aUSD(pl.ingreso_estimado, pl.moneda);
  if (usaCol(l.pipeline_id)) { const pr = colsDe(l.id)[0], cp = pr && S.privCol[pr.college_id]; if (cp && cp.ingreso_estimado != null) return aUSD(cp.ingreso_estimado, cp.moneda); }
  if (pp && pp.ingreso_fijo != null) return aUSD(pp.ingreso_fijo, pipe.moneda);
  const v = l.estado === 'ganado' ? aUSD(l.valor_cierre, l.moneda_cierre) : aUSD(l.valor, l.moneda);
  return v ? v - aUSD(pp && pp.costo_default, pipe.moneda) : 0;
}
const prob = l => (E(l.etapa_id) || {}).probabilidad || 0;
/* colleges */
const ESTADOS_COL = { interesado: 'Interesado', aplico: 'Aplicó', admitido: 'Admitido', rechazado: 'Rechazado', matriculado: 'Matriculado', descartado: 'Descartado' };
const Col = id => S.colleges.find(c => c.id === id);

const colsDe = lid => (S.lc[lid] || []).slice().sort((a, b) => (b.principal ? 1 : 0) - (a.principal ? 1 : 0));
const principalDe = lid => { const x = colsDe(lid)[0]; return x ? Col(x.college_id) : null; };
const colesActivos = () => S.colleges.filter(c => c.activo).sort((a, b) => a.orden - b.orden || a.nombre.localeCompare(b.nombre));
function rgb(h) { h = String(h || '#9AA7A9').replace('#', ''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) || 0); }
function tinte(h, a) { const c = rgb(h); return `rgb(${c.map(x => Math.round(255 - (255 - x) * a)).join(',')})`; }
function textoSobre(h) { const [r, g, b] = rgb(h).map(x => { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); }); return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 0.36 ? '#172426' : '#FFFFFF'; }
const sinTildes = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
function buscarCollege(txt) {
  const t = sinTildes(txt); if (!t) return null;
  const claves = c => [c.nombre, c.sigla].concat(c.alias || []).map(sinTildes).filter(Boolean);
  return S.colleges.find(c => claves(c).includes(t)) || S.colleges.find(c => claves(c).some(k => k.length >= 4 && (t.includes(k) || k.includes(t)))) || null;
}
function waLink(l) {

}

  if (!S.yo) { $('#app').innerHTML = `<div class="login"><div class="caja"><h1>Sin acceso</h1><p>Tu cuenta <b>${esc(S.sesion.user.email)}</b> existe, pero no tiene acceso activo al CRM. Pídeselo al administrador.</p><button class="btn" data-act="salir">Salir</button></div></div>`; return; }

async function cargar() {
  const uid = S.sesion.user.id;
  S.yo = await q(sb.from('crm_usuarios').select('*').eq('user_id', uid).maybeSingle());
  if (!S.yo || !S.yo.activo) { S.yo = null; return; }
  const [us, pi, et, cf, le] = await Promise.all([
    todo('crm_usuarios', c => c.order('nombre')),
    todo('crm_pipelines', c => c.order('orden')),
    todo('crm_etapas', c => c.order('orden')),
    q(sb.from('crm_config').select('*').eq('id', 1).maybeSingle()),
    todo('crm_leads', c => c.order('created_at').order('id'))
  ]);
  S.usuarios = us; S.pipelines = pi; S.etapas = et; S.leads = le; if (cf) S.config = cf;
  try {                                   // colleges (Etapa 2). Si aún no se corrió su SQL, el CRM sigue funcionando.
    const [co, lc] = await Promise.all([todo('crm_colleges', c => c.order('orden').order('nombre')), todo('crm_lead_colleges', c => c.order('created_at').order('id'))]);
    S.colleges = co; S.lc = {}; lc.forEach(x => { (S.lc[x.lead_id] = S.lc[x.lead_id] || []).push(x); }); S.sinCol = false;
  } catch (e) { S.colleges = []; S.lc = {}; S.sinCol = true; }
  if (!P(S.pipeId) || !P(S.pipeId).activo) S.pipeId = (pipesActivos()[0] || {}).id || null;
  if (esAdmin()) await cargarAdmin();
}
/* Solo admin: margen + enlace con el panel financiero */
async function cargarAdmin() {
  const [pl, pp, lo] = await Promise.all([todo('crm_lead_privado'), todo('crm_pipeline_privado'), todo('crm_lotes', c => c.order('created_at', { ascending: false }))]);
  S.privLead = Object.fromEntries(pl.map(x => [x.lead_id, x])); S.privPipe = Object.fromEntries(pp.map(x => [x.pipeline_id, x])); S.lotes = lo;
  if (!S.sinCol) { try { const pc = await todo('crm_college_privado'); S.privCol = Object.fromEntries(pc.map(x => [x.college_id, x])); } catch (e) { S.privCol = {}; } }
  S.fin = { ok: false, tc: null, error: null };
  try {
    try { S.productos = await q(sb.from('productos').select('id,nombre').order('nombre')); } catch (e) { S.productos = []; }
    S.vendedores = await q(sb.from('vendedores').select('id,nombre,rol,activo').order('nombre'));
    const aj = await q(sb.from('ajustes').select('tc').limit(1));
    let tc = aj && aj[0] ? Number(aj[0].tc) : null;
    try { const t = await q(sb.from('tipos_cambio').select('tc,fecha').order('fecha', { ascending: false }).limit(1)); if (t && t[0]) tc = Number(t[0].tc); } catch (e) { /* tabla opcional */ }
    S.fin = { ok: true, tc, error: null };
    if (tc && Math.abs(tc - Number(S.config.tc)) > 0.00005) {       // el TC del CRM sigue al de finanzas
      const c = await q(sb.from('crm_config').update({ tc, tc_actualizado: new Date().toISOString() }).eq('id', 1).select().single()); S.config = c;
    }
  } catch (e) { S.fin = { ok: false, tc: null, error: msgErr(e) }; }
}

  const pipes = pipesActivos();
  if (!pipes.length) return `<h1>Pipeline</h1><div class="caja">Todavía no hay pipelines. ${esAdmin() ? 'Créalos en Configuración.' : ''}</div>`;

    <div id="tablero">${tablero()}</div>`;
}
function tablero() {
  const p = P(S.pipeId); if (!p) return '';
  let ls = visibles().filter(l => l.pipeline_id === p.id);
  let ab = ls.filter(l => l.estado === 'abierto' && (!S.f.vencidos || ['vencido', 'sin'].includes(vence(l))));
  let leyenda = '';
  if (usaCol(p.id)) {                     // filtro y leyenda de colores por college
    const tiene = (l, v) => v === 'todos' ? true : v === 'sin' ? !colsDe(l.id).length : colsDe(l.id).some(x => x.college_id === v);
    const ops = [['todos', 'Todos', null]].concat(colesActivos().map(c => [c.id, c.nombre, c])).concat([['sin', 'Sin college', null]]);
    if (!ops.some(o => o[0] === S.f.college)) S.f.college = 'todos';
    leyenda = `<div class="fila" role="group" aria-label="Filtrar por college" style="margin-bottom:12px"><span class="mut b">College:</span>${ops.map(([v, t, c]) => `<button type="button" class="lchip ${S.f.college === v ? 'on' : ''}" data-act="fCol" data-v="${v}" ${c ? `style="--c:${c.color}"` : ''} aria-pressed="${S.f.college === v}">${c || v === 'sin' ? '<i></i>' : ''}${esc(t)} <b>${ab.filter(l => tiene(l, v)).length}</b></button>`).join('')}</div>`;
    ab = ab.filter(l => tiene(l, S.f.college));
  }
  const mes = new Date(); mes.setDate(1); mes.setHours(0, 0, 0, 0);
  const cerr = e => ls.filter(l => l.estado === e && l.cerrado_en && new Date(l.cerrado_en) >= mes).length;
  const tot = ab.reduce((a, l) => a + aUSD(l.valor, l.moneda), 0), pon = ab.reduce((a, l) => a + aUSD(l.valor, l.moneda) * prob(l) / 100, 0);
  const cols = etapasDe(p.id).map(e => {
    const cs = ab.filter(l => l.etapa_id === e.id).sort((a, b) => (a.prox_vence ? new Date(a.prox_vence).getTime() : 0) - (b.prox_vence ? new Date(b.prox_vence).getTime() : 0));

      ${esAdmin() ? `<div class="kpi" style="border-color:#F5D77A;background:#FFFBEB"><span>Ingreso propio ponderado</span><b>${usd(ab.reduce((a, l) => a + ingresoUSD(l) * prob(l) / 100, 0))}</b><small>solo lo ves tú</small></div>` : ''}
      <div class="kpi"><span>Vencidos / sin próxima acción</span><b class="rojo">${ab.filter(l => vence(l) === 'vencido').length} / ${ab.filter(l => vence(l) === 'sin').length}</b></div>
    </div>
    ${huerf ? `<div class="aviso a">${huerf} lead(s) están en una etapa desactivada y no aparecen en el tablero. Búscalos en Base de leads.</div>` : ''}
    <p class="mut" style="margin:10px 0 8px">Arrastra una tarjeta a otra etapa. Al empezar a arrastrar aparecen abajo las zonas <b>Ganado</b> y <b>Perdido</b> para cerrarla. TC ${Number(S.config.tc).toFixed(3)}.</p>

    </div></div>`;
}
function tarjeta(l) {
  const v = vence(l), sub = [l.colegio, l.grado].filter(Boolean).join(' · ') || (l.apoderado_nombre ? 'Apod. ' + l.apoderado_nombre : (l.ciudad || '')), wa = waLink(l), d = dias(l.etapa_desde);
  let cc = '', banda = '';
  if (usaCol(l.pipeline_id)) {
    const cs = colsDe(l.id), pr = cs[0] && Col(cs[0].college_id);
    if (pr) {
      cc = ` cc" style="background:${tinte(pr.color, 0.11)};border-color:${tinte(pr.color, 0.6)}`;

async function soltar(id, destino) {
  const l = L(id); if (!l) return;

  Object.assign(l, { etapa_id: destino, etapa_desde: new Date().toISOString() }); renderMain();     // se ve al instante
  const { data, error } = await sb.from('crm_leads').update({ etapa_id: destino }).eq('id', id).select().single();
  if (error) { Object.assign(l, antes); renderMain(); return toast(msgErr(error), 'err'); }
  Object.assign(l, data); toast(`${l.nombre} → ${E(destino).nombre}`);

function adivinar(h) {
  const s = String(h).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const tel = /(tel|cel|whats|phone|movil|numero)/, mail = /(mail|correo)/;

  if (/parentesco/.test(s)) return 'apoderado_parentesco';
  if (/(apellido|last.?name|surname)/.test(s)) return 'apellido';
  if (mail.test(s)) return 'email'; if (tel.test(s)) return 'telefono';
  if (/(nacimiento|birth|cumple)/.test(s)) return 'fecha_nacimiento';
  if (/(college|universit|universidad|campus|destino)/.test(s)) return 'colleges';
  if (/(colegio|school|instituc)/.test(s)) return 'colegio';
  if (/(grado|egreso|grade|curso$|año|anio)/.test(s)) return 'grado';
  if (/(ciudad|city|distrito)/.test(s)) return 'ciudad'; if (/(pais|country)/.test(s)) return 'pais';
  if (/(ingles|english|toefl)/.test(s)) return 'nivel_ingles';
  if (/(programa|interes|servicio|producto)/.test(s)) return 'programa_interes';
  if (/(valor|precio|monto|amount)/.test(s)) return 'valor';
  if (/(fuente|source|origen|canal|campan)/.test(s)) return 'fuente';
  if (/(etiqueta|tag)/.test(s)) return 'etiquetas';

  return '';
}
function parseCSV(txt) {
  txt = txt.replace(/^﻿/, '');
  const l1 = txt.split(/\r?\n/, 1)[0], sep = [';', '\t', ','].map(c => [c, l1.split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
  const filas = []; let fila = [], cur = '', com = false;
  for (let i = 0; i < txt.length; i++) { const ch = txt[i];
    if (com) { if (ch === '"') { if (txt[i + 1] === '"') { cur += '"'; i++; } else com = false; } else cur += ch; }
    else if (ch === '"') com = true; else if (ch === sep) { fila.push(cur); cur = ''; }
    else if (ch === '\n') { fila.push(cur); filas.push(fila); fila = []; cur = ''; } else if (ch !== '\r') cur += ch; }

}

function analizar() {
  const im = S.imp, exT = new Set(), exM = new Set(), vT = new Set(), vM = new Set(), r = { nuevos: [], dupCRM: [], dupArch: 0, malos: 0, aCrear: [], colNuevos: [], conCol: 0 };
  const nuevosCol = new Map();
  S.leads.forEach(l => { [l.telefono, l.apoderado_telefono].forEach(x => { const k = tel9(x); if (k) exT.add(k); }); [l.email, l.apoderado_email].forEach(x => { if (x) exM.add(String(x).toLowerCase()); }); });
  im.filas.forEach(f => {
    const o = { etiquetas: [] }; let ape = '';
    im.mapa.forEach((c, i) => { const v = String(f[i] ?? '').trim(); if (!c || !v) return;
      if (c === 'apellido') ape = v; else if (c === 'telefono' || c === 'apoderado_telefono') o[c] = normTel(v); else if (c === 'email' || c === 'apoderado_email') o[c] = v.toLowerCase();
      else if (c === 'valor') { const n = Number(v.replace(/[^\d.,-]/g, '').replace(/,(?=\d{3}\b)/g, '').replace(',', '.')); if (!isNaN(n)) o.valor = n; }
      else if (c === 'colleges') { o._cols = v.split(/\s*(?:[,;\/|+]| y | and )\s*/i).map(x => x.trim()).filter(Boolean).map(x => { const m = buscarCollege(x); if (m) return { id: m.id }; const k = sinTildes(x); if (!nuevosCol.has(k)) nuevosCol.set(k, x); return { nuevo: k }; }); }
      else if (c === 'fecha_nacimiento') o[c] = parseFecha(v); else if (c === 'etiquetas') o.etiquetas = v.split(/[,;]/).map(s => s.trim()).filter(Boolean); else o[c] = v; });
    if (ape) o.nombre = ((o.nombre || '') + ' ' + ape).trim();
    const ts = [tel9(o.telefono), tel9(o.apoderado_telefono)].filter(Boolean), ms = [o.email, o.apoderado_email].filter(Boolean);
    if (!o.nombre || (!ts.length && !ms.length)) return void r.malos++;
    if (ts.some(k => vT.has(k)) || ms.some(k => vM.has(k))) return void r.dupArch++;
    ts.forEach(k => vT.add(k)); ms.forEach(k => vM.add(k));
    (ts.some(k => exT.has(k)) || ms.some(k => exM.has(k)) ? r.dupCRM : r.nuevos).push(o);
  });
  r.aCrear = im.dup === 'crear' ? r.nuevos.concat(r.dupCRM) : r.nuevos;
  r.colNuevos = Array.from(nuevosCol.values()); r.conCol = r.aCrear.filter(o => o._cols && o._cols.length).length;
  return r;
}

  const id = el.dataset.id, k = el.dataset.k, act = Object.assign({ college_id: id, moneda: 'USD' }, S.privCol[id] || {});
  act[k] = el.value === '' ? null : k === 'ingreso_estimado' ? Number(el.value) : el.value;
  try { S.privCol[id] = await q(sb.from('crm_college_privado').upsert({ college_id: id, producto_id: act.producto_id || null, ingreso_estimado: act.ingreso_estimado ?? null, moneda: act.moneda || 'USD' }, { onConflict: 'college_id' }).select().single()); toast('Dato privado guardado.'); } catch (e) { toast(msgErr(e), 'err'); }
};
F.nuevoCol = async f => { try { const orden = Math.max(0, ...S.colleges.map(c => c.orden)) + 1; const c = await q(sb.from('crm_colleges').insert({ nombre: f.nombre.value.trim(), sigla: f.sigla.value.trim().toUpperCase(), color: f.color.value, alias: [sinTildes(f.nombre.value)], orden }).select().single()); S.colleges.push(c); renderMain(); toast('College agregado.'); } catch (e) { toast(msgErr(e), 'err'); } };
C.usr = async el => {
  const k = el.dataset.k, v = k === 'activo' ? el.checked : (el.value === '' ? null : el.value.trim()); if (k === 'nombre' && !v) return renderMain();
  const { data, error } = await sb.from('crm_usuarios').update({ [k]: v }).eq('user_id', el.dataset.id).select().single();
  if (error) { toast(msgErr(error), 'err'); return renderMain(); }
  Object.assign(U(el.dataset.id), data); if (data.user_id === S.yo.user_id) S.yo = data; render(); toast('Usuario actualizado.');
};
F.alta = async f => { try { const u = await q(sb.rpc('crm_alta_usuario', { p_email: f.email.value.trim(), p_nombre: f.nombre.value.trim(), p_rol: f.rol.value, p_supervisor: null })); S.usuarios = S.usuarios.filter(x => x.user_id !== u.user_id).concat([u]).sort((a, b) => a.nombre.localeCompare(b.nombre)); renderMain(); toast(`${u.nombre} ya puede entrar al CRM.`); } catch (e) { toast(msgErr(e), 'err'); } };
F.pipe = async f => {
  const id = f.dataset.id, n = x => f[x].value === '' ? null : Number(f[x].value);
  try {
    const p = await q(sb.from('crm_pipelines').update({ nombre: f.nombre.value.trim(), moneda: f.moneda.value, valor_default: n('valor_default'), unidad_finanzas: f.unidad_finanzas.value.trim() || null, activo: f.activo.checked, ...(f.usa_colleges ? { usa_colleges: f.usa_colleges.checked } : {}) }).eq('id', id).select().single());
    Object.assign(P(id), p);
    S.privPipe[id] = await q(sb.from('crm_pipeline_privado').upsert({ pipeline_id: id, costo_default: n('costo_default'), ingreso_fijo: n('ingreso_fijo') }, { onConflict: 'pipeline_id' }).select().single());
    if (!P(S.pipeId) || !P(S.pipeId).activo) S.pipeId = (pipesActivos()[0] || {}).id || null;
    renderMain(); toast('Pipeline guardado.');
  } catch (e) { toast(msgErr(e), 'err'); }
};
F.nuevoPipe = async f => { try { const orden = Math.max(0, ...S.pipelines.map(p => p.orden)) + 1; const p = await q(sb.from('crm_pipelines').insert({ nombre: f.nombre.value.trim(), moneda: f.moneda.value, orden }).select().single()); const es = await q(sb.from('crm_etapas').insert([{ pipeline_id: p.id, nombre: 'Nuevo', orden: 1, probabilidad: 10 }, { pipeline_id: p.id, nombre: 'Contactado', orden: 2, probabilidad: 25 }]).select()); S.pipelines.push(p); S.etapas = S.etapas.concat(es); if (!S.pipeId) S.pipeId = p.id; renderMain(); toast('Pipeline creado con 2 etapas iniciales.'); } catch (e) { toast(msgErr(e), 'err'); } };
F.nuevaEtapa = async f => { const pid = f.dataset.id; try { const orden = Math.max(0, ...etapasDe(pid, true).map(e => e.orden)) + 1; const e = await q(sb.from('crm_etapas').insert({ pipeline_id: pid, nombre: f.nombre.value.trim(), orden, probabilidad: Number(f.prob.value || 0) }).select().single()); S.etapas.push(e); renderMain(); toast('Etapa agregada.'); } catch (x) { toast(msgErr(x), 'err'); } };
C.et = async el => {
  const e = E(el.dataset.id), k = el.dataset.k; let v = k === 'activo' ? el.checked : k === 'probabilidad' ? Math.max(0, Math.min(100, Number(el.value) || 0)) : el.value.trim();
  if (k === 'nombre' && !v) return renderMain();
  if (k === 'activo' && !v && S.leads.some(l => l.etapa_id === e.id && l.estado === 'abierto')) { toast('Esa etapa tiene leads abiertos. Muévelos antes de desactivarla.', 'err'); return renderMain(); }
  const { data, error } = await sb.from('crm_etapas').update({ [k]: v }).eq('id', e.id).select().single();
  if (error) { toast(msgErr(error), 'err'); return renderMain(); }
  Object.assign(e, data); renderMain(); toast('Etapa actualizada.');
};
A.etSube = async el => { const e = E(el.dataset.id), ets = etapasDe(e.pipeline_id, true), i = ets.findIndex(x => x.id === e.id); if (i < 1) return; const o = ets[i - 1], a = e.orden, b = o.orden === a ? a - 1 : o.orden;
  try { await q(sb.from('crm_etapas').update({ orden: b }).eq('id', e.id)); await q(sb.from('crm_etapas').update({ orden: a }).eq('id', o.id)); e.orden = b; o.orden = a; renderMain(); } catch (x) { toast(msgErr(x), 'err'); } };
F.cfg = async f => { try { S.config = await q(sb.from('crm_config').update({ dias_estancado: Number(f.dias.value) }).eq('id', 1).select().single()); renderMain(); toast('Ajustes guardados.'); } catch (e) { toast(msgErr(e), 'err'); } };

document.addEventListener('click', e => { const el = e.target.closest && e.target.closest('[data-act]'); if (!el) return; const fn = A[el.dataset.act]; if (!fn) return; if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault(); fn(el, e); });
document.addEventListener('change', e => { const el = e.target.closest && e.target.closest('[data-chg]'); if (el && C[el.dataset.chg]) C[el.dataset.chg](el, e); });
document.addEventListener('input', e => { const el = e.target.closest && e.target.closest('[data-inp]'); if (el && I[el.dataset.inp]) I[el.dataset.inp](el, e); });
document.addEventListener('submit', e => { const f = e.target.closest && e.target.closest('form[data-sub]'); if (!f) return; e.preventDefault(); if (F[f.dataset.sub]) F[f.dataset.sub](f, e); });
init();
